services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: smart_campus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    depends_on:
      - db

    environment:
      POSTGRES_DB: smart_campus
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus_dev
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    ports:
      - "8000:8000"

volumes:
  postgres_data:
